<style>
/* Layout (kanstik.uz pattern, Spektr brand): night top bar, sticky white header with Catalog button + search + request list, hero slider beside two tiles, 4 direction tiles, catalog grid, 5-step process, about, request form, contacts band, footer, mobile tab bar. Single light brand theme by design. */
:root{
  --purple:#412A9D; --purple-2:#4B36B4; --purple-3:#6A55D6; --night:#1C1340; --yellow:#FFB71B;
  --white:#FFFFFF; --beton:#ECEAF2; --steel:#6E6A85; --graphite:#16141F; --lav:#8B7ED8;
  --line:#DDD9E9; --muted:#6E6A85; --ok:#1E7A4C; --err:#C62828;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#ECEAF2; --surface-3:#E2DEEE; --text:#16141F; --accent:#412A9D; --accent-text:#412A9D;
  --inv-bg:#1C1340; --inv-fg:#FFFFFF; --logo:#412A9D; --foot:#16141F; --ok-bg:#E6F4EC; --s2-bg:#FFFFFF; --grid-l:rgba(65,42,157,.07);
  --f-head:"Montserrat","Arial Black",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --wrap:1240px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14121D; --surface:#1C1830; --surface-2:#231D3F; --surface-3:#2C2550; --text:#ECEAF2; --muted:#A7A2C0; --line:#302A4A; --accent:#7B67E0; --accent-text:#AB9EF4; --inv-bg:#ECEAF2; --inv-fg:#1C1340; --logo:#FFFFFF; --foot:#0D0B14; --ok-bg:rgba(93,194,139,.14); --s2-bg:#1C1830; --grid-l:rgba(255,255,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121D; --surface:#1C1830; --surface-2:#231D3F; --surface-3:#2C2550; --text:#ECEAF2; --muted:#A7A2C0; --line:#302A4A; --accent:#7B67E0; --accent-text:#AB9EF4; --inv-bg:#ECEAF2; --inv-fg:#1C1340; --logo:#FFFFFF; --foot:#0D0B14; --ok-bg:rgba(93,194,139,.14); --s2-bg:#1C1830; --grid-l:rgba(255,255,255,.06); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img,svg{max-width:100%}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hd-h,150px) + 12px)}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-weight:600;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hl{background:var(--yellow);color:var(--night);padding:0 .16em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tag-box{display:inline-block;background:var(--purple);color:#fff;font-family:var(--f-body);font-weight:600;padding:.25em .55em;font-size:clamp(1rem,1.8vw,1.35rem);letter-spacing:0;text-transform:none}
.grid-bg{background-image:linear-gradient(var(--gl,rgba(255,255,255,.07)) 1px,transparent 1px),linear-gradient(90deg,var(--gl,rgba(255,255,255,.07)) 1px,transparent 1px);background-size:44px 44px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:.98rem;padding:13px 22px;border-radius:8px;border:2px solid transparent;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-y{background:var(--yellow);color:var(--night)}
.btn-p{background:var(--purple);color:#fff}
.btn-o{border-color:currentColor;background:transparent}

/* Top bar */
.topbar{background:var(--night);color:#CFC9E8;font-size:.82rem}
.topbar .wrap{display:flex;align-items:center;gap:18px;min-height:38px;flex-wrap:wrap}
.topbar .tb-tag{font-weight:600;letter-spacing:.14em;color:#fff}
.topbar .sp{margin-left:auto;display:flex;align-items:center;gap:18px}
.topbar a{text-decoration:none;color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.theme-btn{all:unset;cursor:pointer;display:grid;place-items:center;width:30px;height:28px;border-radius:6px;background:rgba(255,255,255,.08);color:#fff}
.theme-btn svg.i{width:17px;height:17px}
.theme-btn:focus-visible{outline:2px solid var(--yellow)}
.langs{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:6px;padding:2px}
.langs button{all:unset;cursor:pointer;font-size:.74rem;font-weight:700;padding:4px 9px;border-radius:5px;color:#CFC9E8}
.langs button[aria-pressed="true"]{background:var(--yellow);color:var(--night)}
.langs button:focus-visible{outline:2px solid var(--yellow)}
@media (max-width:700px){.topbar .tb-hours{display:none}.topbar .tb-tag{display:none}.topbar .sp{margin-left:0;width:100%;justify-content:space-between}}

/* Header */
header.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);box-shadow:0 1px 0 var(--line)}
.hd-main{display:grid;grid-template-columns:auto auto 1fr auto;grid-template-areas:"logo cat search list";align-items:center;gap:16px;padding-block:14px}
.logo{grid-area:logo;display:flex;align-items:center;color:var(--logo);text-decoration:none}
.logo svg{height:44px;width:auto;display:block}
.logo .compact{display:none}
.cat-btn{grid-area:cat}
.cat-btn .x{display:none}
.cat-btn[aria-expanded="true"] .g{display:none}.cat-btn[aria-expanded="true"] .x{display:block}
form.search{grid-area:search;display:flex;min-width:0;border:2px solid var(--accent);border-radius:8px;overflow:hidden;background:var(--bg)}
form.search input{flex:1;min-width:0;border:0;padding:11px 14px;font:inherit;background:transparent;color:var(--text)}
form.search input:focus{outline:none}
form.search:focus-within{box-shadow:0 0 0 3px rgba(65,42,157,.18)}
form.search button{border:0;background:var(--accent);color:#fff;padding:0 18px;cursor:pointer;display:flex;align-items:center}
.list-btn{all:unset;grid-area:list;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600;padding:8px 10px;border-radius:8px;position:relative}
.list-btn:hover{background:var(--surface-2)}
.list-btn:focus-visible{outline:3px solid var(--yellow)}
.list-btn .ico{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--surface-2);color:var(--accent-text)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--yellow);color:var(--night);font-size:.72rem;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge[data-n="0"]{display:none}
.list-btn .lbl small{display:block;font-size:.75rem;color:var(--muted);font-weight:500}
nav.sub{border-top:1px solid var(--line)}
nav.sub .wrap{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
nav.sub .wrap::-webkit-scrollbar{display:none}
nav.sub a{white-space:nowrap;text-decoration:none;font-size:.9rem;font-weight:500;color:var(--muted);padding:11px 0;border-bottom:2px solid transparent}
nav.sub a:hover{color:var(--accent-text);border-color:var(--accent-text)}
nav.sub a.cta{margin-left:auto;color:var(--accent-text);font-weight:700}
@media (max-width:900px){
  .hd-main{grid-template-columns:auto 1fr auto;grid-template-areas:"logo . list" "cat search search";gap:10px 10px;padding-block:10px}
  .list-btn .lbl{display:none}
  .cat-btn{padding:11px 14px}.cat-btn .t{display:none}
  .logo svg{height:36px}
}
@media (max-width:520px){.logo .full{display:none}.logo .compact{display:block;height:24px}}

/* Mega menu */
.mega{position:absolute;left:0;right:0;top:100%;background:var(--bg);box-shadow:0 18px 40px rgba(28,19,64,.18);border-top:1px solid var(--line)}
.mega .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-block:22px}
.mega a{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r);text-decoration:none;background:var(--surface-2)}
.mega a:hover{background:var(--surface-3)}
.mega h4{font-size:1rem;font-weight:800}
.mega p{font-size:.86rem;color:var(--muted);margin-top:4px}
.mega .cnt{font-size:.78rem;font-weight:700;color:var(--accent-text);margin-top:8px}
@media (max-width:900px){.mega .wrap{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.mega .wrap{grid-template-columns:1fr}}
.ic{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;flex:none;background:var(--c,var(--purple));color:var(--fg,#fff)}
.ic.lg{width:64px;height:64px}.ic.lg svg.i{width:30px;height:30px}

/* Hero */
.hero .wrap{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:16px;padding-block:20px}
.slider{position:relative;border-radius:14px;overflow:hidden;min-height:480px;background:var(--purple)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:44px clamp(24px,5vw,56px);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.slide.on{opacity:1;visibility:visible}
.slide>*{position:relative;z-index:1;max-width:600px}
.slide h1,.slide h2{font-weight:900;line-height:1.16;font-size:clamp(1.9rem,4vw,3.15rem)}
.slide p{font-size:1.02rem;max-width:46ch}
.slide .ctas{display:flex;gap:12px;flex-wrap:wrap}
.s-purple{background:var(--purple);color:#fff}
.s-purple .eyebrow{color:#CFC9E8}
.s-purple .bigS{position:absolute;right:-6%;top:-14%;height:128%;width:auto;color:var(--purple-2);z-index:0;max-width:none}
.s-white{background:var(--s2-bg);color:var(--text);--gl:var(--grid-l)}
.s-white h2{color:var(--accent-text);text-transform:uppercase}
.s-white .art{position:absolute;right:4%;bottom:6%;width:min(44%,330px);z-index:0;max-width:none}
.s-yellow{background:var(--yellow);color:var(--night)}
.s-yellow .eyebrow{color:rgba(28,19,64,.7)}
.s-yellow .art{position:absolute;right:3%;bottom:8%;width:min(52%,400px);z-index:0;max-width:none}
.slines{position:absolute;left:0;bottom:36px;display:flex;flex-direction:column;gap:10px;z-index:0;max-width:none}
.slines i{display:block;height:12px;background:var(--yellow)}
.dots{position:absolute;left:clamp(24px,5vw,56px);bottom:22px;display:flex;gap:8px;z-index:3}
.dots button{all:unset;cursor:pointer;width:28px;height:6px;border-radius:3px;background:rgba(127,118,160,.45)}
.dots button[aria-current="true"]{background:var(--yellow);width:44px}
.dots button:focus-visible{outline:2px solid var(--night)}
.arrows{position:absolute;right:18px;bottom:16px;display:flex;gap:8px;z-index:3}
.arrows button{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(28,19,64,.55);color:#fff}
.arrows button:focus-visible{outline:2px solid var(--yellow)}
.side{display:grid;grid-template-rows:1fr auto;gap:16px;min-width:0}
.tile{border-radius:14px;padding:26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tile-night{background:var(--night);color:#fff}
.tile-night h3{font-size:1.25rem;font-weight:800}
.tile-night ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tile-night li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.12);font-weight:500;font-size:.95rem}

/* ---------- isometric illustrations (brandbook style) ---------- */
const PAL = {
  white:["#FFFFFF","#DCD6F7","#B3A8EE"], purple:["#6A55D6","#412A9D","#2E1D78"],
  yellow:["#FFC94D","#FFB71B","#E09A00"], lav:["#ECEAF2","#C9C2EE","#A79BE6"]
};
function iso(boxes, pad = 6){
  const pt = (x,y,z) => [(x - y) * 0.866 * 20, ((x + y) * 0.5 - z) * 20];
  let polys = [], xs = [], ys = [];
  for (const b of boxes){
    const {x,y,z,w,d,h} = b, [top,left,right] = PAL[b.c], f = b.f || "tlr";
    const faces = [];
    if (f.includes("l")) faces.push([left,[pt(x,y+d,z),pt(x+w,y+d,z),pt(x+w,y+d,z+h),pt(x,y+d,z+h)]]);
    if (f.includes("r")) faces.push([right,[pt(x+w,y,z),pt(x+w,y+d,z),pt(x+w,y+d,z+h),pt(x+w,y,z+h)]]);
    if (f.includes("t")) faces.push([top,[pt(x,y,z+h),pt(x+w,y,z+h),pt(x+w,y+d,z+h),pt(x,y+d,z+h)]]);
    for (const [col,ps] of faces){ ps.forEach(p => { xs.push(p[0]); ys.push(p[1]); });
      polys.push(`<polygon fill="${col}" points="${ps.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}"/>`); }
  }
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad, w = Math.max(...xs) - x0 + pad, h = Math.max(...ys) - y0 + pad;
  return `<svg viewBox="${x0.toFixed(0)} ${y0.toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}" width="100%" aria-hidden="true" style="display:block;overflow:visible">${polys.join("")}</svg>`;
}
const ART = {
  build: () => {
    const b = [{x:0,y:0,z:0,w:6.4,d:4.4,h:.5,c:"yellow"}];
    for (let z = 0; z < 3; z++) for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++)
      b.push({x:.2+i*2.02,y:.2+j*2.02,z:.5+z*.92,w:1.96,d:1.96,h:.88,c:"white"});
    b.push({x:2.4,y:.6,z:3.26,w:2.6,d:1.2,h:.7,c:"white"});
    return iso(b);
  },
  home: () => {
    const B = (x,y,z,w,d,h) => [{x,y,z,w,d,h,c:"purple"},{x:x+w/2-.18,y:y-.01,z:z,w:.36,d:d+.02,h:h+.02,c:"yellow",f:"tl"}];
    return iso([...B(0,0,0,3.2,2.6,2),...B(3.6,.8,0,2.6,2.2,1.7),...B(.4,.3,2,2.5,2,1.7)]);
  },
  plumb: () => iso([
    {x:0,y:0,z:0,w:4.6,d:3.4,h:.25,c:"white"},{x:1.2,y:1.2,z:.25,w:1.2,d:1.2,h:.25,c:"yellow"},
    {x:1.5,y:1.5,z:.5,w:.6,d:.6,h:2.6,c:"lav"},{x:1.45,y:1.45,z:3.1,w:.7,d:.7,h:.3,c:"yellow"},
    {x:1.65,y:.2,z:3.4,w:.3,d:1.6,h:.2,c:"yellow"},
    {x:3.85,y:1.5,z:2.1,w:.5,d:.6,h:.5,c:"lav"},{x:2.1,y:1.5,z:2.6,w:2.25,d:.6,h:.5,c:"lav"}
  ]),
  clean: () => iso([
    {x:0,y:0,z:0,w:2.6,d:1.7,h:3.2,c:"purple"},{x:.35,y:1.71,z:.8,w:1.8,d:.01,h:1.5,c:"white",f:"l"},
    {x:.25,y:.2,z:3.2,w:1.4,d:1,h:.5,c:"purple"},{x:1.85,y:.55,z:3.2,w:.5,d:.5,h:.45,c:"white"},
    {x:3,y:1.2,z:0,w:1.3,d:1.3,h:2.4,c:"purple"},{x:3.35,y:1.55,z:2.4,w:.6,d:.6,h:.5,c:"white"},
    {x:3.35,y:2.1,z:2.55,w:.6,d:.9,h:.3,c:"white"}
  ])
};

/* ---------- render ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  $$("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $$("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $$("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  $$(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("#mapLink").href = "https://yandex.uz/maps/?text=" + encodeURIComponent("Toshkent, Muqimiy ko'chasi 14");
  syncTheme(); renderMega(); renderDirs(); renderTabs(); renderCards(); renderDrawer(); renderFooterCats(); updateCounts(); acRender();
}
function renderMega(){
  $("#megaList").innerHTML = Object.entries(DIRS).map(([k,v]) =>
    `<a href="#catalog" data-dir="${k}"><span class="ic" style="--c:${v.c};--fg:${v.fg}">${icon(v.icon)}</span><span><h4>${v.n[lang]}</h4><p>${v.d[lang]}</p><div class="cnt">${count(k)} ${t("pos")}</div></span></a>`).join("");
}
function renderDirs(){
  $("#dirs").innerHTML = Object.entries(DIRS).map(([k,v],i) =>
    `<button class="dir" type="button" data-dir="${k}" style="--c:${v.c};--fg:${v.fg};--nc:${v.nc}">
      <span class="num">0${i+1}</span><span class="art">${ART[k]()}</span>
      <span><h3>${v.n[lang]}</h3><span class="meta"><span>${count(k)} ${t("pos")}</span><span>${t("to_cat")} →</span></span></span>
    </button>`).join("");
}
function renderTabs(){
  const items = [["all",t("all"),"var(--text)"]].concat(Object.entries(DIRS).map(([k,v]) => [k,v.n[lang],v.c]));
  $("#tabs").innerHTML = items.map(([k,l,c]) => `<button class="tab" type="button" data-dir="${k}" aria-pressed="${k===dir}" style="--c:${c}"><i></i>${l}</button>`).join("");
}
function renderCards(){
  const q = query.trim().toLowerCase();
  const res = P.filter(p => (dir === "all" || p.dir === dir) && (!q || p.id.toLowerCase().includes(q) || Object.values(p.n).some(n => n.toLowerCase().includes(q))));
  if (!res.length){ $("#cards").innerHTML = `<div class="empty">${t("empty")}</div>`; return; }
  $("#cards").innerHTML = res.map(p => { const D = DIRS[p.dir], inL = list[p.id];
    return `<article class="card" data-id="${p.id}">
      <div class="media"><span class="ic lg" style="--c:${D.c};--fg:${D.fg}">${icon(D.icon)}</span><img src="img/products/${p.id}.jpg" alt="${esc(p.n[lang])}" width="640" height="400" loading="lazy" decoding="async" onerror="this.remove()"><span class="code">${p.id}</span></div>
      <div class="body" style="--c:${D.c}"><span class="dt"><i></i>${D.n[lang]}</span><h3>${p.n[lang]}</h3><p class="spec">${p.s[lang]}</p><p class="price">${t("price")}</p></div>
      <div class="act">
        <div class="stepper"><button type="button" data-step="-1" aria-label="-">−</button><input type="number" min="1" value="${inL || 1}" aria-label="qty"><span class="u">${U[p.u][lang]}</span><button type="button" data-step="1" aria-label="+">+</button></div>
        <button type="button" class="btn ${inL ? "add in" : "btn-p add"}" data-add>${inL ? icon("i-check") + t("added") : t("add")}</button>
      </div></article>`; }).join("");
}
function renderDrawer(){
  const ids = Object.keys(list);
  if (!ids.length){ $("#drList").innerHTML = `<div class="dr-empty">${t("dr_empty")}</div>`; return; }
  $("#drList").innerHTML = ids.map(id => { const p = P.find(x => x.id === id); if (!p) return ""; const D = DIRS[p.dir];
    return `<div class="dr-item" data-id="${id}"><span class="ic" style="--c:${D.c};--fg:${D.fg}">${icon(D.icon)}</span>
      <div><h4>${p.n[lang]}</h4><button type="button" class="rm" data-rm>${t("remove")}</button></div>
      <div class="stepper"><button type="button" data-dstep="-1" aria-label="-">−</button><input type="number" min="1" value="${list[id]}" aria-label="qty"><span class="u">${U[p.u][lang]}</span><button type="button" data-dstep="1" aria-label="+">+</button></div></div>`; }).join("");
}
function renderFooterCats(){ $("#fCats").innerHTML = Object.entries(DIRS).map(([k,v]) => `<li><a href="#catalog" data-dir="${k}">${v.n[lang]}</a></li>`).join(""); }
function updateCounts(){
  const n = Object.keys(list).length;
  $$(".badge").forEach(b => { b.textContent = n; b.dataset.n = n; });
  $("#inCount").textContent = n;
}
function setDir(d, scroll){ dir = d; renderTabs(); renderCards(); closeMega(); if (scroll) $("#catalog").scrollIntoView(); }

/* ---------- theme ---------- */

try { mq.addEventListener("change", syncTheme); } catch(e){}

document.addEventListener("click", e => {
  if (!e.target.closest("#mega") && !e.target.closest("#catBtn")) closeMega();
  const dl = e.target.closest("[data-dir]");
  if (dl && (dl.closest("#megaList") || dl.closest("#dirs") || dl.closest("#fCats"))){ e.preventDefault(); setDir(dl.dataset.dir, true); }

});

$("#q").addEventListener("input", () => { query = $("#q").value; $("#hq").value = query; renderCards(); });

$("#cards").addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return; const id = card.dataset.id, inp = card.querySelector("input");
  const st = e.target.closest("[data-step]");
  if (st){ inp.value = Math.max(1, (parseInt(inp.value) || 1) + +st.dataset.step); if (list[id]){ list[id] = +inp.value; save(); renderDrawer(); } return; }
  if (e.target.closest("[data-add]")){
    if (list[id]){ openDrawer(); return; }
    list[id] = Math.max(1, parseInt(inp.value) || 1); save(); updateCounts(); renderDrawer(); renderCards(); toast(t("toast"));
  }
});
$("#cards").addEventListener("change", e => { const card = e.target.closest(".card"); if (!card || e.target.tagName !== "INPUT") return;
  e.target.value = Math.max(1, parseInt(e.target.value) || 1); if (list[card.dataset.id]){ list[card.dataset.id] = +e.target.value; save(); renderDrawer(); } });

/* drawer */
function openDrawer(){ renderDrawer(); document.body.classList.add("dopen"); $("#drawer").setAttribute("aria-hidden","false"); setTimeout(() => $("#drClose").focus(), 50); }
function closeDrawer(){ document.body.classList.remove("dopen"); $("#drawer").setAttribute("aria-hidden","true"); }
["#listBtn","#listBtn2","#openList2"].forEach(s => $(s).addEventListener("click", openDrawer));

$("#drList").addEventListener("click", e => {
  const it = e.target.closest(".dr-item"); if (!it) return; const id = it.dataset.id;
  if (e.target.closest("[data-rm]")){ delete list[id]; save(); updateCounts(); renderDrawer(); renderCards(); return; }
  const st = e.target.closest("[data-dstep]");
  if (st){ list[id] = Math.max(1, list[id] + +st.dataset.dstep); it.querySelector("input").value = list[id]; save(); renderCards(); }

$("#drList").addEventListener("change", e => { const it = e.target.closest(".dr-item"); if (!it) return; list[it.dataset.id] = Math.max(1, parseInt(e.target.value) || 1); e.target.value = list[it.dataset.id]; save(); renderCards(); });
$("#drClear").addEventListener("click", () => { list = {}; save(); updateCounts(); renderDrawer(); renderCards(); });
function listText(){ return Object.entries(list).map(([id,q]) => { const p = P.find(x => x.id === id); return p ? `${p.n[lang]} (${id}): ${q} ${U[p.u][lang]}` : ""; }).filter(Boolean).join("\n"); }
$("#drGo").addEventListener("click", () => {
  const lt = listText(), ta = $("#plist");

  closeDrawer(); $("#request").scrollIntoView(); setTimeout(() => $("#org").focus({preventScroll:true}), 400);
});

/* slider */
const slides = [...$$(".slide")]; let cur = 0, timer;
$("#dots").innerHTML = slides.map((_,i) => `<button type="button" aria-label="${i+1}" aria-current="${i===0}"></button>`).join("");
function go(i){ cur = (i + slides.length) % slides.length; slides.forEach((s,j) => { s.classList.toggle("on", j === cur); s.setAttribute("aria-hidden", j !== cur); });
  $$("#dots button").forEach((b,j) => b.setAttribute("aria-current", j === cur)); }
function auto(){ clearInterval(timer); if (!matchMedia("(prefers-reduced-motion: reduce)").matches) timer = setInterval(() => go(cur + 1), 7000); }
$$("#dots button").forEach((b,i) => b.addEventListener("click", () => { go(i); auto(); }));
$("#prev").addEventListener("click", () => { go(cur - 1); auto(); }); $("#next").addEventListener("click", () => { go(cur + 1); auto(); });
$("#slider").addEventListener("mouseenter", () => clearInterval(timer)); $("#slider").addEventListener("mouseleave", auto);
$("#slider").addEventListener("focusin", () => clearInterval(timer));
$("#artBoxes").innerHTML = ART.home();
go(0); auto();

/* phone mask */
const phone = $("#phone");
function maskPhone(phone){ phone.addEventListener("input", () => {
  let d = phone.value.replace(/\D/g, ""); if (!d.startsWith("998")) d = "998" + d; d = d.slice(0,12); const r = d.slice(3);
  let o = "+998"; if (r.length) o += " " + r.slice(0,2); if (r.length > 2) o += " " + r.slice(2,5); if (r.length > 5) o += " " + r.slice(5,7); if (r.length > 7) o += " " + r.slice(7,9);
  phone.value = o;
}); }
maskPhone(phone);
$("#inn").addEventListener("input", e => e.target.value = e.target.value.replace(/\D/g,"").slice(0,9));

/* submit */
function mark(id, ok){ $("#f-"+id).classList.toggle("bad", !ok); $("#f-"+id+" .err").hidden = ok; return ok; }
$("#rq").addEventListener("submit", async e => {
  e.preventDefault();
  const org = $("#org").value.trim(), nm = $("#pname").value.trim(), ph = phone.value.replace(/\D/g,""), pl = $("#plist").value.trim();
  const v = [mark("org", org.length >= 2), mark("name", nm.length >= 2), mark("phone", ph.length === 12), mark("list", pl.length >= 2)];
  if (v.includes(false)){ const first = ["org","pname","phone","plist"][v.indexOf(false)]; $("#"+first).focus(); return; }
  const text = `🏢 Yangi buyurtma (sayt)\nTashkilot: ${org}\nSTIR: ${$("#inn").value || "-"}\nMas'ul shaxs: ${nm}\nTelefon: ${phone.value}\nManzil: ${$("#addr").value.trim() || "-"}\nTil: ${lang.toUpperCase()}\n\nPozitsiyalar:\n${pl}`;
  const st = $("#status"), btn = $("#send");
  btn.disabled = true; btn.textContent = t("sending");
  try {
    if (!ac.sb) throw new Error("Supabase client not loaded");
    const order = await acSaveOrder({ org, inn: $("#inn").value, contact_name: nm, phone: phone.value, address: $("#addr").value.trim(), request_text: pl, lang });
    st.className = "status ok"; st.hidden = false;
    st.textContent = t("ok") + (order ? " " + t("ac_order_saved").replace("{n}", order.id) : "");
    e.target.reset(); phone.value = "+998 "; list = {}; save(); updateCounts(); renderDrawer(); renderCards(); acPrefill();
  } catch(err){ console.error(err); st.className = "status warn"; st.hidden = false; st.innerHTML = esc(t("fail")) + `<pre>${esc(text)}</pre>`; }
  finally { btn.disabled = false; btn.textContent = t("f_send"); }
});

/* copy */
document.addEventListener("click", e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const done = () => { b.textContent = t("copied"); setTimeout(() => b.textContent = t("copy"), 1500); };
  try { navigator.clipboard.writeText(b.dataset.copy).then(done, () => {}); } catch(err){}
});

/* tab bar highlight */
const tabLinks = [...$$(".tabbar a")];
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ const id = en.target.dataset.tab; tabLinks.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + id)); } }), {rootMargin:"-45% 0px -50% 0px"});
[["home","top"],["catalog","catalog"],["contacts","contacts"]].forEach(([id,h]) => { const el = document.getElementById(id); if (el){ el.dataset.tab = h; io.observe(el); } });

/* ---------- shaxsiy kabinet ---------- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const SB_SRC = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js";
const SB_SRI = "sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug";
const ac = { sb:null, user:null, profile:null, orders:null, failed:false, recovery:false, auth:"in", forgot:false, tab:"orders" };

const fullName = () => ac.profile ? `${ac.profile.first_name} ${ac.profile.last_name}`.trim() : "";
function acMsg(text, ok){ const m = $("#acMsg"); m.hidden = !text; m.className = "status " + (ok ? "ok" : "warn"); m.textContent = text || ""; if (text) m.scrollIntoView({block:"nearest"}); }
function acErr(e){
  const c = (e && e.code) || "", m = String((e && e.message) || "");
  if (c === "invalid_credentials" || /invalid login/i.test(m)) return t("ac_e_cred");
  if (c === "email_not_confirmed" || /not confirmed/i.test(m)) return t("ac_e_unconf");
  if (c === "user_already_exists" || /already registered/i.test(m)) return t("ac_e_exists");
  if ((e && e.status === 429) || /rate limit/i.test(m)) return t("ac_e_rate");
  if (c === "weak_password") return t("ac_e_pass");
  return t("ac_e_gen");
}
async function acSubmit(form, fn){
  const b = form.querySelector('[type="submit"]');
  if (!ac.sb) return acMsg(t("ac_e_gen"));
  acMsg(""); b.disabled = true; b.textContent = t("sending");
  try { await fn(); } catch(err){ console.error(err); acMsg(acErr(err)); }
  finally { b.disabled = false; b.textContent = t(b.dataset.i18n); }
}
const sbCheck = r => { if (r.error) throw r.error; return r.data; };

function acRender(){
  const signed = !!ac.user, view = ac.recovery ? "reset" : signed ? "home" : ac.forgot ? "forgot" : "auth";
  $("#acAuth").hidden = view !== "auth"; $("#acForgot").hidden = view !== "forgot"; $("#acReset").hidden = view !== "reset"; $("#acHome").hidden = view !== "home";
  $("#acIn").hidden = ac.auth !== "in"; $("#acUp").hidden = ac.auth !== "up";
  $$("[data-ac-auth]").forEach(b => b.setAttribute("aria-selected", b.dataset.acAuth === ac.auth));
  $("#acBtnSub").textContent = signed ? (fullName() || ac.user.email) : t("ac_sub_out");
  const rq = $("#rqAc");
  if (SUPABASE.url && SUPABASE.anonKey){
    rq.hidden = false;
    rq.innerHTML = signed ? `${esc(t("ac_rq_in"))} <b>${esc(ac.user.email)}</b>` : `${esc(t("ac_rq_out"))} <button class="ac-link" type="button" id="rqLogin">${esc(t("ac_rq_login"))}</button>`;
  }
  if (!signed) return;
  const nm = fullName();
  $("#acAva").textContent = (nm || ac.user.email).charAt(0).toUpperCase();
  $("#acName").textContent = nm; $("#acMail").textContent = ac.user.email;
  const all = ac.orders || [], done = all.filter(o => o.status === "delivered");
  $$("[data-ac-tab]").forEach(b => {
    const k = b.dataset.acTab;
    b.setAttribute("aria-selected", k === ac.tab);
    if (k === "orders") b.textContent = t("ac_orders") + (ac.orders ? ` (${all.length})` : "");
    if (k === "purchases") b.textContent = t("ac_purchases") + (ac.orders ? ` (${done.length})` : "");
  });
  $("#acProfile").hidden = ac.tab !== "profile"; $("#acOrders").hidden = ac.tab === "profile";
  if (ac.tab === "profile") return;
  const box = $("#acOrders"), rows = ac.tab === "purchases" ? done : all;
  if (ac.failed && !ac.orders) box.innerHTML = `<div class="ac-empty">${esc(t("ac_load_fail"))}</div>`;
  else if (!ac.orders) box.innerHTML = `<div class="ac-empty">${esc(t("ac_loading"))}</div>`;
  else if (!rows.length) box.innerHTML = `<div class="ac-empty"><p>${esc(t(ac.tab === "purchases" ? "ac_no_purchases" : "ac_no_orders"))}</p><p style="margin-top:12px"><a class="ac-link" href="#catalog" data-ac-go>${esc(t("ac_to_catalog"))}</a></p></div>`;
  else box.innerHTML = rows.map(o => {
    const known = ["new","processing","delivered","cancelled"].includes(o.status);
    const when = new Date(o.created_at).toLocaleDateString("ru-RU");
    return `<article class="ord"><div class="ord-h"><b>№ ${esc(o.id)}</b><span class="ord-st${known ? " st-" + o.status : ""}">${esc(known ? t("ac_st_" + o.status) : o.status)}</span></div><small>${esc(when)}</small><div class="ord-org">${esc(o.org)}</div><pre>${esc(o.request_text)}</pre>${o.amount != null ? `<div class="ord-sum">${esc(Number(o.amount).toLocaleString("ru-RU"))} ${esc(t("ac_sum"))}</div>` : ""}</article>`;
  }).join("");
}
function acPrefill(){
  if (!ac.profile) return;
  if (!$("#pname").value.trim()) $("#pname").value = fullName();
  if (phone.value.replace(/\D/g,"").length <= 3 && ac.profile.phone) phone.value = ac.profile.phone;
}
async function acLoadOrders(){
  ac.failed = false; acRender();
  try {
    ac.orders = sbCheck(await ac.sb.from("orders").select("*").order("created_at", { ascending:false }));
  } catch(err){ console.error(err); ac.failed = true; }
  acRender();
}
async function acLoadUser(){
  try {
    ac.profile = sbCheck(await ac.sb.from("profiles").select("*").eq("id", ac.user.id).single());
    $("#pfFirst").value = ac.profile.first_name; $("#pfLast").value = ac.profile.last_name; $("#pfPhone").value = ac.profile.phone || "+998 ";
    acPrefill();
  } catch(err){ console.error(err); }
  acLoadOrders();
}
async function acSaveOrder(row){
  /* Kirmagan mijoz qatorni o'qiy olmaydi, shuning uchun raqam qaytmaydi */
  if (!ac.user){ sbCheck(await ac.sb.from("orders").insert(row)); return null; }
  const order = sbCheck(await ac.sb.from("orders").insert(row).select().single());
  if (ac.orders) ac.orders.unshift(order);
  acRender();
  return order;
}
function acOpen(){
  closeDrawer(); document.body.classList.add("aopen"); $("#acct").setAttribute("aria-hidden","false"); setTimeout(() => $("#acClose").focus(), 50);
  if (!ac.sb) acMsg(t("ac_e_gen"));
  if (ac.user && ac.sb) acLoadOrders();
}
function acClose(){ document.body.classList.remove("aopen"); $("#acct").setAttribute("aria-hidden","true"); }

["#acBtn","#acBtn2"].forEach(s => $(s).addEventListener("click", acOpen));
$("#acClose").addEventListener("click", acClose); $("#ovl").addEventListener("click", acClose);
["#upPhone","#pfPhone"].forEach(s => maskPhone($(s)));
document.addEventListener("click", e => { if (e.target.closest("#rqLogin")) acOpen(); if (e.target.closest("[data-ac-go]")) acClose(); });
$$("[data-ac-auth]").forEach(b => b.addEventListener("click", () => { ac.auth = b.dataset.acAuth; acMsg(""); acRender(); }));
$$("[data-ac-tab]").forEach(b => b.addEventListener("click", () => { ac.tab = b.dataset.acTab; acMsg(""); acRender(); }));
$("#acForgotBtn").addEventListener("click", () => { ac.forgot = true; $("#fgEmail").value = $("#inEmail").value; acMsg(""); acRender(); });
$("#acBack").addEventListener("click", () => { ac.forgot = false; acMsg(""); acRender(); });
$("#acOut").addEventListener("click", async () => { if (ac.sb) await ac.sb.auth.signOut({ scope:"local" }); });

const redirectTo = () => location.origin + location.pathname;
$("#acIn").addEventListener("submit", e => {
  e.preventDefault();
  const email = $("#inEmail").value.trim().toLowerCase(), password = $("#inPass").value;
  const ok = [mark("inEmail", EMAIL_RE.test(email)), mark("inPass", password.length > 0)];
  if (ok.includes(false)) return;
  acSubmit(e.target, async () => { sbCheck(await ac.sb.auth.signInWithPassword({ email, password })); e.target.reset(); });
});
$("#acUp").addEventListener("submit", e => {
  e.preventDefault();
  const first_name = $("#upFirst").value.trim(), last_name = $("#upLast").value.trim(), email = $("#upEmail").value.trim().toLowerCase(), tel = $("#upPhone").value, password = $("#upPass").value;
  const ok = [mark("upFirst", first_name.length >= 2), mark("upLast", last_name.length >= 2), mark("upEmail", EMAIL_RE.test(email)), mark("upPhone", tel.replace(/\D/g,"").length === 12), mark("upPass", password.length >= 8)];
  if (ok.includes(false)) return;
  acSubmit(e.target, async () => {
    const d = sbCheck(await ac.sb.auth.signUp({ email, password, options:{ data:{ first_name, last_name, phone: tel }, emailRedirectTo: redirectTo() } }));
    /* Email tasdiqlash yoqilganda, band manzil uchun Supabase xato emas, identities bo'sh user qaytaradi */
    if (d.user && !d.session && !(d.user.identities || []).length) return acMsg(t("ac_e_exists"));
    e.target.reset(); $("#upPhone").value = "+998 ";
    if (!d.session){ ac.auth = "in"; acRender(); acMsg(t("ac_confirm"), true); }
  });
});
$("#acForgot").addEventListener("submit", e => {
  e.preventDefault();
  const email = $("#fgEmail").value.trim().toLowerCase();
  if (!mark("fgEmail", EMAIL_RE.test(email))) return;
  acSubmit(e.target, async () => { sbCheck(await ac.sb.auth.resetPasswordForEmail(email, { redirectTo: redirectTo() })); acMsg(t("ac_forgot_done"), true); });
});
$("#acReset").addEventListener("submit", e => {
  e.preventDefault();
  const password = $("#rsPass").value;
  if (!mark("rsPass", password.length >= 8)) return;
  acSubmit(e.target, async () => { sbCheck(await ac.sb.auth.updateUser({ password })); e.target.reset(); ac.recovery = false; acRender(); acMsg(t("ac_reset_done"), true); });
});
$("#acProfile").addEventListener("submit", e => {
  e.preventDefault();
  const first_name = $("#pfFirst").value.trim(), last_name = $("#pfLast").value.trim(), tel = $("#pfPhone").value;
  const ok = [mark("pfFirst", first_name.length >= 2), mark("pfLast", last_name.length >= 2), mark("pfPhone", tel.replace(/\D/g,"").length === 12)];
  if (ok.includes(false)) return;
  acSubmit(e.target, async () => {
    ac.profile = sbCheck(await ac.sb.from("profiles").update({ first_name, last_name, phone: tel }).eq("id", ac.user.id).select().single());
    acRender(); acMsg(t("ac_saved_profile"), true);
  });
});

function acInit(){
  if (!SUPABASE.url || !SUPABASE.anonKey) return;
  document.body.classList.add("has-acct"); $("#acBtn").hidden = false; $("#acBtn2").hidden = false;
  const s = document.createElement("script");
  s.src = SB_SRC; s.integrity = SB_SRI; s.crossOrigin = "anonymous";
  s.onload = () => {
    ac.sb = supabase.createClient(SUPABASE.url, SUPABASE.anonKey);
    ac.sb.auth.onAuthStateChange((ev, session) => {
      const u = (session && session.user) || null, changed = (u && u.id) !== (ac.user && ac.user.id);
      ac.user = u;
      if (ev === "PASSWORD_RECOVERY"){ ac.recovery = true; acOpen(); }
      if (changed){ ac.profile = null; ac.orders = null; ac.tab = "orders"; ac.forgot = false; if (!u){ ac.recovery = false; $("#acProfile").reset(); } }
      acRender();
      /* Supabase chaqiruvlari shu callback ichida kutilsa, klient qotib qoladi */
      if (changed && u) setTimeout(acLoadUser, 0);
    });
  };
  s.onerror = () => console.error("Supabase client failed to load");
  document.head.append(s);
}
acInit();

applyLang();

/* bo'limga o'tganda sarlavha uning boshini yopmasin */
const syncHd = () => document.documentElement.style.setProperty("--hd-h", $("#hd").offsetHeight + "px");
syncHd(); new ResizeObserver(syncHd).observe($("#hd"));
</script>
